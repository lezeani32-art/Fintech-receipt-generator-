<!DOCTYPE html>
<html>
<head>
  <title>Generate Transaction ID</title>
</head>
<body>

<h2>Generated ID:</h2>
<p id="output"></p>

<script>
function generateBankStyleID() {
  const prefix = "cpt1";

  // Random 5-character alphanumeric string
  const node = Math.random().toString(36).substring(2, 7);

  // Current timestamp in milliseconds
  const timestamp = Date.now();

  // Random 12-character hex string
  const randomHash = [...Array(12)]
    .map(() => Math.floor(Math.random() * 16).toString(16))
    .join('');

  return `${prefix}::${node}-${timestamp}-${randomHash}`;
}

document.getElementById("output").innerText = generateBankStyleID();
</script>

</body>
</html>
